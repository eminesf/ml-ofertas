# Postgres local — substitui o Railway enquanto o projeto roda no PC.
# Subir: docker compose up -d   |   DATABASE_URL=postgresql://mlofertas:mlofertas@localhost:5433/mlofertas
services:
  postgres:
    image: postgres:16-alpine
    container_name: ml-ofertas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: mlofertas
      POSTGRES_PASSWORD: mlofertas
      POSTGRES_DB: mlofertas
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - ml-ofertas-pgdata:/var/lib/postgresql/data

volumes:
  ml-ofertas-pgdata:
